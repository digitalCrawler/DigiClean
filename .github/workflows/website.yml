# Publishes website/ (the landing page) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# No redeploy is needed per release: links point at /releases/latest and the
# version number is read from the GitHub API in the browser.
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point download links at this repository
        run: sed -i "s|__GITHUB_REPOSITORY__|${GITHUB_REPOSITORY}|g" website/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: website }
      - id: deployment
        uses: actions/deploy-pages@v4
