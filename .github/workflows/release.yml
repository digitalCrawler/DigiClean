# Builds DigiClean for Windows, macOS and Linux and publishes a GitHub
# Release. Trigger: push a version tag, e.g.  git tag v1.2.0 && git push --tags
#
# The landing page links to /releases/latest/download/<file>, so the file
# names below must stay stable.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the leading v) — creates a draft release"
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      # Optional code signing; secrets cannot be tested directly in `if:`.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> build/windows/x64/plugins/digiclean_bridge/cargokit_build" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        run: flutter build windows --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}
      - name: Decode signing certificate
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          "WINDOWS_CERT_PFX_PATH=$path" >> $env:GITHUB_ENV
      - name: Package
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # Shown in Settings > Apps; set the DIGICLEAN_PUBLISHER repository variable to override.
          DIGICLEAN_URL: ${{ github.server_url }}/${{ github.repository }}
          DIGICLEAN_PUBLISHER: ${{ vars.DIGICLEAN_PUBLISHER || github.repository_owner }}
        run: ./packaging/windows/package.ps1 -Version ${{ needs.version.outputs.version }}
      - name: Test the installer (for me only, then for all users)
        shell: pwsh
        run: |
          ./packaging/windows/test-installer.ps1 -Version ${{ needs.version.outputs.version }}
          ./packaging/windows/test-installer.ps1 -AllUsers -Version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*, if-no-files-found: error }

  macos:
    needs: version
    runs-on: macos-15
    env:
      # Optional signing + notarization; secrets cannot be tested directly in `if:`.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - name: Import signing certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Build (universal arm64 + x86_64)
        run: flutter build macos --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}
      - name: Package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/package.sh ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*, if-no-files-found: error }

  linux:
    needs: version
    # Older Ubuntu = older glibc = the binaries run on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: flutter build linux --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ github.run_number }}
      - name: Package
        run: bash packaging/linux/package.sh ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*, if-no-files-found: error }

  publish:
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: DigiClean ${{ needs.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: dist/*
