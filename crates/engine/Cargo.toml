[package]
name = "digiclean_engine"
description = "Content-based duplicate file and folder detection engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blake3.workspace = true
globset.workspace = true
hex.workspace = true
log.workspace = true
parking_lot.workspace = true
rayon.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Archives: deflate only, pure-Rust backend (no C toolchain needed).
zip = { version = "5", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Copy-on-write clones (APFS, Btrfs, XFS, ReFS).
reflink-copy = "0.1"
# Photo analysis: JPEG decoded at 1/8 scale (fast); other formats via image.
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "=0.25.6", default-features = false, features = ["png", "webp", "gif", "bmp"] }
# Similar audio and videos: decode the soundtrack (MPL-2.0) and fingerprint it (MIT).
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "vorbis", "ogg", "wav", "pcm", "mkv"] }
rusty-chromaprint = "=0.3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# System trash is only meaningful on desktop operating systems.
[target.'cfg(any(windows, target_os = "macos", all(target_os = "linux", not(target_os = "android"))))'.dependencies]
trash = "5.2"

[dev-dependencies]
tempfile.workspace = true
# Tests write JPEGs to analyse.
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png"] }
