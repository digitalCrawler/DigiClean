[package]
name = "digiclean_bridge"
description = "flutter_rust_bridge bindings for the DigiClean engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
